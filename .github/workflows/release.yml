name: Build & Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build ZIP and create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Extrair versão da tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Criar ZIP do plugin
        run: |
          mkdir -p build
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='build' \
            --exclude='.vscode' \
            --exclude='.idea' \
            --exclude='*.md' \
            --exclude='CHANGELOG.md' \
            --exclude='assets' \
            --exclude='Screenshorts' \
            ./ build/cache-busting/
          cd build && zip -r cache-busting.zip cache-busting/
          ls -la

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: build/cache-busting.zip
          generate_release_notes: true
          name: "v${{ steps.version.outputs.VERSION }}"
          body: |
            ## 📦 Cache Busting v${{ steps.version.outputs.VERSION }}

            ### 📥 Instalação

            1. Baixe o arquivo `cache-busting.zip` abaixo
            2. No WordPress: **Plugins → Adicionar novo → Enviar plugin**
            3. Selecione o ZIP e clique em **Instalar agora**
            4. Ative o plugin
            5. Acesse **Configurações → Cache Busting**

            ### 🚀 Uso rápido

            Após ativar, acesse **Configurações → Cache Busting** e clique em **Forçar Atualização Agora** para invalidar o cache dos navegadores.

            ---

            ### 📝 Mudanças nesta versão